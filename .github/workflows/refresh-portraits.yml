name: Refresh champion portraits

# Every day, self-host a portrait for any newly-added champion in the current
# Vega + Lagacy tier list. mirror_portraits.py looks up a portrait URL (Fandom
# wiki, then mcochub), downloads a copy into public/portraits/, and registers
# it in lib/portraits_local.json — the files the Vercel build actually serves.
# Runs before the 06:00 UTC data rebuild so new champions get a working
# portrait the same day. Idempotent: no changes when everything is covered.
#
# Then fetch_banner.py points public/banner.jpg at the newest champion the tier
# lists rank, using Kabam's own spotlight art. Also idempotent — it only writes
# when the newest ranked champion changes, roughly monthly.

on:
  schedule:
    - cron: "30 5 * * *"  # 05:30 UTC daily, before the Vercel data refresh (06:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-portraits
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pillow is only needed to crop the banner here, so it stays out of
          # requirements.txt and the Vercel function bundle.
          pip install -r requirements.txt Pillow

      - name: Self-host portraits for any new champions
        run: python mirror_portraits.py

      - name: Point the banner at the newest ranked champion
        run: python fetch_banner.py

      - name: Commit changes if any
        run: |
          # Only commit the artifacts the Vercel build serves.
          git add public/portraits/ lib/portraits_local.json lib/portraits.json \
                  public/banner.jpg public/*.html banner_meta.json
          # banner-default.jpg is the committed fallback; it is never rewritten.
          if git diff --cached --quiet; then
            echo "No portrait or banner changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh champion portraits and banner (auto)"
          git push
